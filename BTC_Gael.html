<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>Mi Wallet</title>
<style>
  :root {
    --bg: #0b0d14;
    --card: #151925;
    --line: #232838;
    --text: #f2f4fa;
    --muted: #8a91a8;
    --blue: #3375ff;
    --up: #2ecc8f;
    --down: #ff5b6e;
    --btc: #f7931a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }

  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; }
  .wallet-name { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), #7aa5ff); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 0; color: var(--text); display: grid; place-items: center; }

  main { flex: 1; overflow-y: auto; padding: 0 20px 24px; }

  .balance { text-align: center; padding: 36px 0 28px; }
  .balance small { color: var(--muted); font-size: 14px; }
  .balance h1 { font-size: 44px; font-weight: 700; letter-spacing: -1px; margin-top: 6px; }
  .balance h1 span { font-size: 18px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }

  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 28px; }
  .action { background: none; border: 0; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; }
  .action i { width: 52px; height: 52px; border-radius: 50%; background: var(--card); display: grid; place-items: center; transition: background .15s; }
  .action:active i { background: var(--blue); }
  .action svg { width: 22px; height: 22px; stroke: var(--blue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .action:active svg { stroke: #fff; }

  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .tabs button { background: none; border: 0; color: var(--muted); font-size: 15px; font-weight: 600; padding: 10px 0; position: relative; }
  .tabs button.on { color: var(--text); }
  .tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--blue); border-radius: 2px; }

  .asset { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
  .coin { width: 42px; height: 42px; border-radius: 50%; background: var(--btc); display: grid; place-items: center; flex: none; }
  .coin svg { width: 24px; height: 24px; fill: #fff; }
  .info { flex: 1; min-width: 0; }
  .info b { display: block; font-size: 16px; }
  .info .sub { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 3px; flex-wrap: wrap; }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }
  .amount { text-align: right; }
  .amount b { display: block; font-size: 16px; }
  .amount span { font-size: 13px; color: var(--muted); }


  .chart-card { background: var(--card); border-radius: 16px; padding: 14px 14px 10px; margin-top: 4px; }
  .chart-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; min-height: 18px; }
  .chart-head #tip { color: var(--text); font-variant-numeric: tabular-nums; }
  .chart { position: relative; height: 200px; touch-action: pan-y; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .chart .ln { fill: none; stroke: currentColor; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .chart .cursor { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .chart-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }


  .chart-wrap { position: relative; }
  .axis { position: absolute; right: 2px; font-size: 10px; color: var(--muted); pointer-events: none; text-shadow: 0 0 4px var(--card), 0 0 4px var(--card); font-variant-numeric: tabular-nums; }
  .axis.hi { top: 0; } .axis.lo { bottom: 0; }
  .chart .up { fill: var(--up); stroke: var(--up); }
  .chart .down { fill: var(--down); stroke: var(--down); }
  .chart .wick { stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .ohlc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ohlc b { display: block; color: var(--text); font-size: 12px; font-weight: 600; margin-top: 2px; }


  .pl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--card); border-radius: 16px; padding: 14px; margin: 4px 0 12px; font-size: 11px; color: var(--muted); }
  .pl b { display: block; color: var(--text); font-size: 13px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .pl b.up { color: var(--up); } .pl b.down { color: var(--down); }

  .status { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--up); animation: pulse 2s infinite; }
  .dot.err { background: var(--down); }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }

  .skeleton { display: inline-block; width: 90px; height: 14px; border-radius: 6px; background: var(--line); vertical-align: middle; }

  nav { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border-top: 1px solid var(--line); padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); }
  nav button { background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }
  nav button.on { color: var(--blue); }
  nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<header>
  <div class="wallet-name"><div class="avatar"></div>Cartera principal</div>
  <button class="icon-btn" aria-label="Ajustes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
  </button>
</header>

<main>
  <section class="balance">
    <small>Saldo total</small>
    <h1 id="total">$0.00<span>MXN</span></h1>
  </section>

  <section class="actions">
    <button class="action"><i><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></i>Enviar</button>
    <button class="action"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></i>Recibir</button>
    <button class="action"><i><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg></i>Cambiar</button>
    <button class="action"><i><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></i>Comprar</button>
  </section>

  <div class="tabs">
    <button class="on">Cripto</button>
    <button>NFT</button>
  </div>

  <article class="asset">
    <div class="coin">
      <span style="color:#fff;font-size:24px;font-weight:700">₿</span>
    </div>
    <div class="info">
      <b>BTC</b>
      <div class="sub"><span id="price"><span class="skeleton"></span></span><span id="chg" class="chg"></span></div>
    </div>
    <div class="amount">
      <b id="amountBtc">0 BTC</b>
      <span id="amountMxn">$0.00</span>
    </div>
  </article>

  <section class="pl">
    <div>Invertido<b id="plInv">$0.00</b></div>
    <div>Precio promedio<b id="plAvg">$0.00</b></div>
    <div>Ganancia / pérdida<b id="plGain">$0.00</b></div>
  </section>

  <section class="chart-card">
    <div class="chart-head"><span>Bitcoin · 1D</span><span id="tip"></span></div>
    <div class="chart-wrap">
      <div class="chart" id="chart"><div class="chart-empty">Cargando velas…</div></div>
      <span class="axis hi" id="hi"></span><span class="axis lo" id="lo"></span>
    </div>
    <div class="ohlc" id="ohlc"></div>
  </section>

  <div class="status"><i class="dot" id="dot"></i><span id="statusText">Conectando…</span></div>
  <div class="status" id="sheetStatus">Leyendo tu hoja…</div>
</main>

<nav>
  <button class="on"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h.01M3 10h18"/></svg>Cartera</button>
  <button><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>Cambiar</button>
  <button><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.500 8.500l-2 5-5 2 2-5z"/></svg>Explorar</button>
  <button><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil</button>
</nav>

<script>
  const SHEET_URL = "https://script.google.com/macros/s/AKfycbxEbbDW-MwWJQSorzOfWovtWb4YPGWaLp2XTMFgNPCuMI1qoTQZVgWh_W14qOJ8QoK3_g/exec";
  let hold = { btc: 0, invertido: 0, promedio: 0 }; // datos de tu hoja Gael BTC
  let lastPrice = 0;
  const REFRESH_MS = 15000;

  const fmt = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" });
  const $ = (id) => document.getElementById(id);

  async function getPrice() {
    // Principal: CoinGecko
    try {
      const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=mxn&include_24hr_change=true");
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      return { price: d.bitcoin.mxn, change: d.bitcoin.mxn_24h_change };
    } catch (e) {
      // Respaldo: Binance (par BTC/MXN)
      const r = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=BTCMXN");
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      return { price: parseFloat(d.lastPrice), change: parseFloat(d.priceChangePercent) };
    }
  }

  async function update() {
    try {
      const { price, change } = await getPrice();
      $("price").textContent = fmt.format(price);

      const up = change >= 0;
      const chg = $("chg");
      chg.textContent = (up ? "+" : "") + change.toFixed(2) + "%";
      chg.className = "chg " + (up ? "up" : "down");

      lastPrice = price;
      render();

      $("dot").className = "dot live";
      $("statusText").textContent = "Precio en vivo · " + new Date().toLocaleTimeString("es-MX");
    } catch (e) {
      $("dot").className = "dot err";
      $("statusText").textContent = "Sin conexión. Reintentando…";
    }
  }


  // ---- Velas 1D ----
  const CHART_REFRESH_MS = 300000; // 5 min
  const fmt0 = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 });
  let candles = [];

  async function getCandles() {
    try {
      // Principal: Binance, una vela por día
      const r = await fetch("https://api.binance.com/api/v3/klines?symbol=BTCMXN&interval=1d&limit=40");
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      return d.map((k) => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4] }));
    } catch (e) {
      // Respaldo: CoinGecko (velas de 4h) agrupadas por día
      const r = await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/ohlc?vs_currency=mxn&days=30");
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const days = new Map();
      for (const [t, o, h, l, c] of d) {
        const k = Math.floor(t / 864e5);
        const g = days.get(k);
        if (!g) days.set(k, { t, o, h, l, c });
        else { g.h = Math.max(g.h, h); g.l = Math.min(g.l, l); g.c = c; }
      }
      return [...days.values()];
    }
  }

  function setOHLC(i) {
    const k = candles[i];
    if (!k) return;
    $("ohlc").innerHTML =
      "<div>Apertura<b>" + fmt0.format(k.o) + "</b></div>" +
      "<div>Máximo<b>" + fmt0.format(k.h) + "</b></div>" +
      "<div>Mínimo<b>" + fmt0.format(k.l) + "</b></div>" +
      "<div>Cierre<b>" + fmt0.format(k.c) + "</b></div>";
    $("tip").textContent = new Date(k.t).toLocaleDateString("es-MX", { day: "numeric", month: "short" });
  }

  function drawChart() {
    const n = candles.length;
    if (n < 2) return;
    const W = 400, H = 200, pad = 6;
    const min = Math.min(...candles.map((k) => k.l));
    const max = Math.max(...candles.map((k) => k.h));
    const span = max - min || 1;
    const Y = (p) => H - pad - ((p - min) / span) * (H - pad * 2);
    const slot = W / n, bw = slot * 0.68;
    let out = "";
    candles.forEach((k, i) => {
      const cx = slot * i + slot / 2;
      const cls = k.c >= k.o ? "up" : "down";
      const top = Y(Math.max(k.o, k.c));
      const h = Math.max(1.5, Math.abs(Y(k.o) - Y(k.c)));
      out += '<line class="wick ' + cls + '" x1="' + cx.toFixed(1) + '" x2="' + cx.toFixed(1) + '" y1="' + Y(k.h).toFixed(1) + '" y2="' + Y(k.l).toFixed(1) + '"/>' +
             '<rect class="' + cls + '" x="' + (cx - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" stroke-width="0"/>';
    });
    $("chart").innerHTML =
      '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' + out +
      '<line class="cursor" id="cursor" x1="0" x2="0" y1="0" y2="' + H + '" style="display:none"/></svg>';
    $("hi").textContent = fmt0.format(max);
    $("lo").textContent = fmt0.format(min);
    setOHLC(n - 1);
  }

  const chartEl = $("chart");
  function showPoint(e) {
    if (candles.length < 2) return;
    const rect = chartEl.getBoundingClientRect();
    const f = Math.min(0.9999, Math.max(0, (e.clientX - rect.left) / rect.width));
    const i = Math.floor(f * candles.length);
    const c = $("cursor");
    if (c) { const x = (i + 0.5) * (400 / candles.length); c.setAttribute("x1", x); c.setAttribute("x2", x); c.style.display = ""; }
    setOHLC(i);
  }
  function hidePoint() {
    const c = $("cursor");
    if (c) c.style.display = "none";
    setOHLC(candles.length - 1);
  }
  chartEl.addEventListener("pointermove", showPoint);
  chartEl.addEventListener("pointerdown", showPoint);
  chartEl.addEventListener("pointerleave", hidePoint);
  chartEl.addEventListener("pointerup", hidePoint);

  async function updateChart() {
    try {
      candles = await getCandles();
      drawChart();
    } catch (e) {
      if (!candles.length) chartEl.innerHTML = '<div class="chart-empty">No se pudieron cargar las velas</div>';
    }
  }
  updateChart();
  setInterval(updateChart, CHART_REFRESH_MS);

  // ---- Datos de tu hoja (Google Sheets) ----
  function render() {
    const value = hold.btc * lastPrice;
    const gain = value - hold.invertido;
    const pct = hold.invertido > 0 ? (gain / hold.invertido) * 100 : 0;
    $("total").innerHTML = fmt.format(value) + "<span>MXN</span>";
    $("amountBtc").textContent = Number(hold.btc.toFixed(8)) + " BTC";
    $("amountMxn").textContent = fmt.format(value);
    $("plInv").textContent = fmt.format(hold.invertido);
    $("plAvg").textContent = fmt.format(hold.promedio);
    const g = $("plGain");
    g.textContent = (gain >= 0 ? "+" : "") + fmt.format(gain) + " (" + pct.toFixed(2) + "%)";
    g.className = gain > 0 ? "up" : gain < 0 ? "down" : "";
  }

  async function loadSheet() {
    try {
      const r = await fetch(SHEET_URL);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      hold = { btc: +d.btc || 0, invertido: +d.totalInvertido || 0, promedio: +d.promedio || 0 };
      render();
      $("sheetStatus").textContent = "Hoja sincronizada · " + (d.compras || 0) + " compras";
    } catch (e) {
      $("sheetStatus").textContent = "No se pudo leer la hoja (revisa la implementación)";
    }
  }
  loadSheet();
  setInterval(loadSheet, 60000);

  update();
  setInterval(update, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) update(); });
</script>
</body>
</html>
